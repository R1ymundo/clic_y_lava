<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulsrio Registro</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <!-- Google Fonts (combinadas en una sola solicitud) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandstander:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

    <!-- Barra de navegación -->
    <nav id="navegacion" class="navbar navbar-expand-lg bg-body-tertiary"></nav>

    <main class="container">
        <!-- Inicio formulario -->
         
        <div class="containerLogo">
            <img class="logo" src="../assets/icons/logo_clic_lava.png" class="d-block w-100" alt="Logo clic y lava" />
            <h5>Regístrate</h5>
        </div>
        
        <form action="">
            <div class="container my-5">
                <div class="md-6">
                    <label for="Nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control border-primary" id="Nombre"
                            placeholder="Ingresa tu nombre aquí">
                        <div class="valid-feedback" id="nombreValidar"></div>
                </div>

                <div class="md-6">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control border-primary" id="apellidos"
                            placeholder="Ingresa tus apellidos aquí">
                    <div class="valid-feedback" id="emailValidar"></div>
                </div>

                <div class="md-6">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control border-primary" id="correo"
                            placeholder="Ingresa tu correo electrónico aquí">
                        <div class="valid-feedback" id="nombreValidar"></div>
                </div>

                <div class="md-6">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <input type="password" class="form-control border-primary" id="contraseña"
                            placeholder="*************************">
                    <div class="valid-feedback" id="emailValidar"></div>
                </div>

                <div class="md-6">
                    <label for="confirmarCont" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control border-primary" id="confirmarCont"
                            placeholder="*************************">
                        <div class="valid-feedback" id="nombreValidar"></div>
                </div>

                <div class="md-6">
                    <label for="direccion" class="form-label">Dirección</label>
                    <input type="text" class="form-control border-primary" id="direccion"
                            placeholder="Ingresa tu dirección aquí">
                    <div class="valid-feedback" id="emailValidar"></div>
                </div>
  
                <!-- Inicio botón-->
                    <br>
                    <button type="button" id="btnEnviar" class="btn btn-warning button">Registrar</button>
                <!-- Fin botón-->

                <!-- Fin formulario -->
            </div>
        </form>
    </main>

    <!-- Pie de página -->
    <footer class="site-footer mt-5">
        <div id="agregarFooter"></div>
    </footer>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"
    ></script>
    <!-- Scripts locales -->
    <script src="../js/nav.js"></script>
    <script src="../js/scriptFooter.js"></script>
</body>
</html>
